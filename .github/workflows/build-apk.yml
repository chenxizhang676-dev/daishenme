name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          P='    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.INTERNET" />'
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$M"; then sed -i "s|<application|$P\n    <application|" "$M"; fi
      - run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daishenme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
